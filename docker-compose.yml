services:
  pomotroid:
    build: .
    container_name: pomotroid
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - DATA_DIR=/data
      - STATIC_DIR=/app/dist
      - RUST_LOG=info
      - TZ=America/Santiago
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro:z
